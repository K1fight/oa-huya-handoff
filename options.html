<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OA 虎牙号库登录态直通 · 设置</title>
  <style>
    body { font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; padding: 20px 22px; color: #1f2328; background: #fff; min-width: 420px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { color: #57606a; font-size: 12px; margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid #d0d7de;
                       border-radius: 6px; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button { padding: 6px 14px; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa;
             font: inherit; cursor: pointer; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    #msg { margin-top: 12px; font-size: 13px; min-height: 20px; }
    #msg.ok { color: #237804; }
    #msg.err { color: #a8071a; }
    dl { margin: 18px 0 0; padding: 12px 14px; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 8px; }
    dt { font-weight: 600; font-size: 12px; color: #57606a; }
    dd { margin: 0 0 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
         word-break: break-all; }
    dd:last-child { margin-bottom: 0; }
    .note { margin-top: 16px; font-size: 12px; color: #57606a; }
    code { background: #f6f8fa; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>OA 虎牙号库登录态直通</h1>
  <div class="sub">从 OA 后台点「官网」按钮时使用；本页仅用于配置 OA 地址。</div>

  <label for="api">OA 后台地址</label>
  <input id="api" type="text" placeholder="http://103.236.90.63:31000" autocomplete="off" />
  <div class="row">
    <button class="primary" id="save">保存</button>
    <button id="reset">恢复默认</button>
  </div>
  <div id="msg"></div>

  <dl>
    <dt>扩展 ID（OA 后台按此 ID 定位扩展）</dt>
    <dd id="extId">—</dd>
    <dt>当前生效地址</dt>
    <dd id="effective">—</dd>
  </dl>

  <div class="note">
    如果 OA 换域名或端口，改这里的地址即可，不用重装扩展。<br />
    一次性凭据 60 秒有效、兑换即失效；扩展只在写 Cookie 时短暂持有凭据。
  </div>

  <script src="options.js"></script>
</body>
</html>
